<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>La eterna cosecha · Almas</title>
<meta name="description" content="Las almas de «La eterna cosecha»: jefes de mazmorra y archimonstruos para marcar.">
<link rel="icon" href="../favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0c0a; --panel: #15180f; --line: #2a2f22; --fg: #eef2e8; --muted: #9aa58b;
    --boss: #e3c565; --archi: #b7dc69; --done: #3d4a2a;
    --fd: 'Barlow Condensed', sans-serif; --fb: 'Barlow', sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: radial-gradient(90% 60% at 50% 0%, #1a1f17, var(--bg) 70%) fixed; color: var(--fg); font: 15px/1.35 var(--fb); }
  header { position: sticky; top: 0; z-index: 5; background: rgba(11, 12, 10, .94); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 14px 18px; }
  h1 { margin: 0; font: 800 clamp(26px, 4vw, 38px)/1 var(--fd); letter-spacing: .03em; text-transform: uppercase; }
  .sub { color: var(--muted); margin: 4px 0 12px; }
  .stats { display: flex; gap: 18px; flex-wrap: wrap; font: 700 17px var(--fd); letter-spacing: .04em; text-transform: uppercase; }
  .stats b { font-size: 22px; }
  .stats .boss b { color: var(--boss); } .stats .archi b { color: var(--archi); }
  .bar { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; margin: 8px 0 12px; }
  .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--archi), var(--boss)); transition: width .2s; }
  .tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .tools input[type=search] { flex: 1 1 220px; min-width: 0; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); font: inherit; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button, .tools > button, .tools label { padding: 8px 12px; background: var(--panel); color: var(--fg); border: 0; font: 600 14px var(--fb); cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-pressed=true] { background: #2c3420; color: #fff; }
  .tools label { display: flex; gap: 6px; align-items: center; border: 1px solid var(--line); border-radius: 8px; }
  .tools > button { border: 1px solid var(--line); border-radius: 8px; color: var(--muted); }
  main.wrap { padding-top: 6px; padding-bottom: 60px; }
  h2 { display: flex; justify-content: space-between; align-items: baseline; margin: 22px 0 8px; font: 700 20px var(--fd); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--line); padding-bottom: 4px; }
  h2 small { font: 600 14px var(--fb); letter-spacing: 0; text-transform: none; }
  h2.boss { color: var(--boss); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 6px; }
  .m { display: flex; gap: 10px; align-items: center; width: 100%; padding: 6px 10px 6px 6px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: inherit; text-align: left; font: inherit; cursor: pointer; transition: background .12s, opacity .12s; }
  .m:hover { border-color: #46503a; }
  .m:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .m img { width: 44px; height: 44px; object-fit: contain; flex: none; }
  .m .t { min-width: 0; flex: 1; }
  .m .n { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .m .z { color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .m .ck { flex: none; width: 22px; height: 22px; border-radius: 6px; border: 2px solid #56604a; display: grid; place-items: center; font-weight: 800; color: #0b0c0a; }
  .m.boss .n { color: var(--boss); }
  .m[aria-pressed=true] { background: var(--done); opacity: .6; }
  .m[aria-pressed=true] .ck { background: var(--archi); border-color: var(--archi); }
  .m[aria-pressed=true] .ck::after { content: "✓"; }
  .m[aria-pressed=true] .n { text-decoration: line-through; }
  .empty { color: var(--muted); padding: 30px 0; text-align: center; }
</style>
</head>
<body>
<header><div class="wrap">
  <h1>La eterna cosecha</h1>
  <p class="sub">Las almas que pide la misión. Pulsa una para marcarla; se guarda en este navegador.</p>
  <div class="stats">
    <span>Total <b id="sAll">0</b></span>
    <span class="boss">Jefes <b id="sBoss">0</b></span>
    <span class="archi">Archis <b id="sArchi">0</b></span>
  </div>
  <div class="bar"><i id="bar"></i></div>
  <div class="tools">
    <input type="search" id="q" placeholder="Buscar monstruo, mazmorra o zona…  ( / )" autocomplete="off">
    <div class="seg" role="group" aria-label="Tipo">
      <button data-f="all" aria-pressed="true">Todo</button>
      <button data-f="boss" aria-pressed="false">Jefes</button>
      <button data-f="archi" aria-pressed="false">Archis</button>
    </div>
    <label><input type="checkbox" id="hide"> Ocultar hechos</label>
    <button id="reset" type="button">Reiniciar</button>
  </div>
</div></header>
<main class="wrap" id="list"><p class="empty">Cargando…</p></main>
<script>
const KEY = "cosecha:done";
const done = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));
let data = [], filter = "all";
const $ = id => document.getElementById(id);
const norm = s => (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const save = () => localStorage.setItem(KEY, JSON.stringify([...done]));

function stats() {
  const c = t => { const all = data.filter(m => !t || m.t === t); return `${all.filter(m => done.has(m.id)).length}/${all.length}`; };
  $("sAll").textContent = c(); $("sBoss").textContent = c("boss"); $("sArchi").textContent = c("archi");
  $("bar").style.width = `${data.length ? done.size / data.length * 100 : 0}%`;
}

function item(m) {
  const b = document.createElement("button");
  b.type = "button"; b.className = `m ${m.t}`; b.dataset.id = m.id;
  b.setAttribute("aria-pressed", done.has(m.id));
  const where = m.t === "boss" ? `${m.d || m.z} · nv. ${m.lv}` : m.z;
  b.innerHTML = `<img loading="lazy" alt="" src="${m.img}"><span class="t"><div class="n"></div><div class="z"></div></span><span class="ck"></span>`;
  b.querySelector(".n").textContent = m.n; b.querySelector(".z").textContent = where;
  b.title = `${m.n} — ${where}`;
  return b;
}

function section(title, cls, list) {
  const frag = document.createDocumentFragment();
  const h = document.createElement("h2"); h.className = cls;
  h.innerHTML = `<span></span><small>${list.filter(m => done.has(m.id)).length}/${list.length}</small>`;
  h.firstChild.textContent = title;
  const g = document.createElement("div"); g.className = "grid";
  g.append(...list.map(item));
  frag.append(h, g);
  return frag;
}

function render() {
  const q = norm($("q").value.trim()), hide = $("hide").checked;
  const vis = data.filter(m => (filter === "all" || m.t === filter)
    && (!hide || !done.has(m.id))
    && (!q || norm(`${m.n} ${m.d} ${m.z}`).includes(q)));
  const out = $("list"); out.textContent = "";
  if (!vis.length) { out.innerHTML = `<p class="empty">Nada por aquí.</p>`; return; }
  const bosses = vis.filter(m => m.t === "boss").sort((a, b) => a.lv - b.lv || a.n.localeCompare(b.n));
  if (bosses.length) out.append(section("Jefes de mazmorra", "boss", bosses));
  // Los archis, por zona: los que se cazan juntos van juntos
  const zones = new Map();
  for (const m of vis.filter(m => m.t === "archi")) (zones.get(m.z) || zones.set(m.z, []).get(m.z)).push(m);
  for (const z of [...zones.keys()].sort((a, b) => a.localeCompare(b, "es")))
    out.append(section(z, "", zones.get(z).sort((a, b) => a.n.localeCompare(b.n, "es"))));
}

$("list").addEventListener("click", e => {
  const b = e.target.closest(".m"); if (!b) return;
  const id = +b.dataset.id;
  done.has(id) ? done.delete(id) : done.add(id);
  save(); stats();
  if ($("hide").checked) render();
  else {
    b.setAttribute("aria-pressed", done.has(id));
    const g = b.parentElement, small = g.previousElementSibling.querySelector("small");
    small.textContent = `${g.querySelectorAll('.m[aria-pressed=true]').length}/${g.children.length}`;
  }
});
document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => {
  filter = b.dataset.f;
  document.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", x === b));
  render();
}));
$("q").addEventListener("input", render);
$("hide").addEventListener("change", render);
$("reset").addEventListener("click", () => {
  if (!confirm("¿Desmarcar todas las almas?")) return;
  done.clear(); save(); stats(); render();
});
addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== $("q")) { e.preventDefault(); $("q").focus(); }
});
// Otra pestaña con la misma lista: se mantiene al día
addEventListener("storage", e => {
  if (e.key !== KEY) return;
  done.clear(); JSON.parse(e.newValue || "[]").forEach(id => done.add(id)); stats(); render();
});

fetch("cosecha.json").then(r => r.json()).then(d => { data = d; stats(); render(); })
  .catch(() => { $("list").innerHTML = `<p class="empty">No se pudo cargar la lista.</p>`; });
</script>
</body>
</html>
