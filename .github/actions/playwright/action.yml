name: Chromium de Playwright
description: >-
  Instala el Chromium de Playwright con la caché de su versión. Con la caché solo faltan
  las dependencias del sistema, que no se pueden guardar (van en /usr).
runs:
  using: composite
  steps:
    - id: version
      shell: bash
      run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
    - id: cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.version.outputs.version }}
    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: npx playwright install --with-deps chromium
    - if: steps.cache.outputs.cache-hit == 'true'
      shell: bash
      run: npx playwright install-deps chromium
