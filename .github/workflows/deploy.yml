name: Deploy to GitHub Pages

# Cada minuto se paga: un solo job (build y publicación) y nada si el cambio no toca lo
# que se publica (documentación, pruebas, la CI). A mano se publica siempre.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - "tests/**"
      - ".build/**"
      - "playwright*.config.js"
      - ".github/workflows/ci.yml"
      - ".github/workflows/sync-guide*.yml"
      - ".github/ci-paths.mjs"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # La home del sitio, en la raíz de dist/ (/<repo>/), con public/ (img/ y las vistas
      # previas): va primero porque es el único build que vacía dist/
      - run: npm run build:site
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      # El Silvestre en dist/silvestre/ y el Hielos en dist/hielos/: cada uno vacía solo su
      # carpeta y no copia public/, sus imágenes son las de la raíz
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - run: npm run build:hielos
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      # La guía global en dist/global/, sin embebido
      - run: npm run build:global
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      # Los embebidos para Torrente Arcano (dist/embed/silvestre.js y dist/embed/hielos.js),
      # junto al sitio: cargan sus trozos y las imágenes de este mismo despliegue
      - run: npm run build:embed
      - run: npm run build:embed:hielos
      # El hub de los checklists (dist/embed/checklists.js), con las imágenes de public/img/hub/
      - run: npm run build:hub
      # El inicio de torrentearcano.com (dist/embed/inicio.js), con las imágenes de public/img/
      - run: npm run build:inicio
      # «La eterna cosecha» (dist/embed/cosecha.js), con sus almas dentro y las imágenes de
      # public/img/cosecha/
      - run: npm run build:cosecha
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
