name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      # El sitio del Hielos, en dist/hielos/ (/<repo>/hielos/): sin copia de public/, sus
      # imágenes son las de la raíz que acaba de dejar el del Silvestre. Va después: el
      # build del Silvestre vacía dist/
      - run: npm run build:hielos
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      # Los embebidos para Torrente Arcano (dist/embed/silvestre.js y dist/embed/hielos.js),
      # junto al sitio: cargan sus trozos y las imágenes de este mismo despliegue
      - run: npm run build:embed
      - run: npm run build:embed:hielos
      # El hub de los checklists (dist/embed/checklists.js), con las imágenes de public/img/hub/
      - run: npm run build:hub
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
