name: CI

# Las suites de pruebas en cada pull request a main. La protección de main exige el check
# "Pruebas". La sincronización de la guía lo lanza a mano sobre su rama, porque un PR
# abierto con el token del workflow no dispara otros workflows.
#
# Todo va en UN job: se recortó así cuando el repo era privado y cada minuto se pagaba
# (cuatro trozos en paralelo terminaban en unos 7 min pero costaban unos 30 minutos por PR;
# en un job tarda unos 15 y se paga una vez). Un PR en borrador solo pasa las unitarias.
#
# Cada suite con navegador corre solo si el PR toca algo que pueda romperla: el mapa de
# carpetas a suites está en .github/ci-paths.mjs (con sus pruebas en las unitarias). Un PR
# de solo documentación no corre ninguna. Lanzado a mano sobre main, se prueba todo.
#
# Corre en la imagen de Playwright, que ya trae Chromium y lo que necesita del sistema:
# instalarlo con apt dependía del espejo de Ubuntu, que a veces se quedaba 10 minutos
# parado. La versión de la imagen es la de @playwright/test en package-lock.json: un paso
# lo comprueba.
on:
  pull_request:
    branches: [main]
    # ready_for_review: al sacar un PR del borrador corre lo que se saltó mientras lo era
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 35
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Qué cambia
        id: diff
        env:
          BASE: ${{ github.base_ref }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # Un PR en borrador solo pasa las unitarias: las suites con navegador, al sacarlo
          if [ "$DRAFT" = true ]; then
            printf 'e2e=false\nembed=false\nhielos=false\nsite=false\nbuild=false\n' | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          # A mano sobre main se prueba todo; sobre otra rama (la de la sincronización de la
          # guía), lo que cambia respecto a main
          if [ -z "$BASE" ] && [ "$GITHUB_REF_NAME" = main ]; then
            printf 'e2e=true\nembed=true\nhielos=true\nsite=true\nbuild=true\n' | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(git diff --name-only "origin/${BASE:-main}...HEAD")"
          echo "$files"
          echo "$files" | node .github/ci-paths.mjs | tee -a "$GITHUB_OUTPUT"
          if echo "$files" | grep -q '^\.build/'; then echo "build=true"; else echo "build=false"; fi | tee -a "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: La imagen es la de la versión de Playwright
        run: test "$(node -p "require('@playwright/test/package.json').version")" = "1.64.0"
      - run: npm run test:unit
      # El pipeline de .build/ (Python, solo la biblioteca estándar): solo si cambia
      - name: Pruebas de .build/
        if: steps.diff.outputs.build == 'true'
        run: |
          command -v python3 >/dev/null || { apt-get update -qq && apt-get install -y -qq python3 >/dev/null; }
          python3 -I -m unittest discover -s .build/tests
      # Un reintento: los fallos que quedan son de tiempo con la máquina cargada
      - if: steps.diff.outputs.embed == 'true'
        run: npm run test:embed -- --retries=1
      - if: steps.diff.outputs.hielos == 'true'
        run: npm run test:hielos -- --retries=1
      - if: steps.diff.outputs.site == 'true'
        run: npm run test:site -- --retries=1
      - if: steps.diff.outputs.e2e == 'true'
        run: npx playwright test --retries=1
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: test-results
          retention-days: 3
