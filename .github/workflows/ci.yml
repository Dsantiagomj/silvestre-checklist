name: CI

# Las suites de pruebas en cada pull request a main. La protección de main exige que el
# check "Pruebas" pase antes de fusionar: es el último job y solo pasa si pasan todos los
# demás. La sincronización de la guía lo lanza a mano sobre su rama, porque un PR abierto
# con el token del workflow no dispara otros workflows.
#
# El runner de un repo privado tiene 2 vCPU: la suite de la app entera tardaba 15 minutos.
# Va partida en 4 trozos que corren a la vez (--shard), cada uno con su build.
#
# Los jobs con navegador corren en la imagen de Playwright, que ya trae Chromium y lo que
# necesita del sistema. Instalarlo con apt en cada job dependía del espejo de Ubuntu, que
# a veces se quedaba 10 minutos parado. La versión de la imagen es la de @playwright/test
# en package-lock.json: el primer paso lo comprueba.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cada suite con navegador corre solo si el PR toca algo que pueda romperla: el mapa de
  # carpetas a suites está en .github/ci-paths.mjs (con sus pruebas en las unitarias). Lo
  # que se salta cuenta como pasado en "Pruebas" (con paths-ignore el check no llegaría y
  # el PR se quedaría esperándolo). Lanzado a mano, se prueba todo.
  changes:
    name: Qué cambia
    runs-on: ubuntu-latest
    outputs:
      e2e: ${{ steps.diff.outputs.e2e }}
      embed: ${{ steps.diff.outputs.embed }}
      hielos: ${{ steps.diff.outputs.hielos }}
      site: ${{ steps.diff.outputs.site }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.base_ref }}
        run: |
          if [ -z "$BASE" ]; then printf 'e2e=true\nembed=true\nhielos=true\nsite=true\n' >> "$GITHUB_OUTPUT"; exit 0; fi
          files="$(git diff --name-only "origin/$BASE...HEAD")"
          echo "$files"
          echo "$files" | node .github/ci-paths.mjs | tee -a "$GITHUB_OUTPUT"

  # Las del pipeline de .build/ (solo la biblioteca estándar) y las unitarias: siempre
  unit:
    name: Unitarias
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python3 -I -m unittest discover -s .build/tests
      - run: npm run test:unit

  e2e:
    name: App (${{ matrix.shard }}/4)
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    strategy:
      # Un trozo que falla no para los demás: se ven todos los fallos de una vez
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: La imagen es la de la versión de Playwright
        run: test "$(node -p "require('@playwright/test/package.json').version")" = "1.64.0"
      - run: npx playwright test --shard=${{ matrix.shard }}/4 --retries=2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces-${{ matrix.shard }}
          path: test-results
          retention-days: 7

  # Los cinco embebidos en una página como la de Squarespace, con su contrato
  # (tests/embed construye los del Silvestre, el Hielos, el hub, el inicio y la cosecha),
  # la prueba de humo del sitio del Hielos (DOFUS=hielos), servido como en Pages: en
  # hielos/ con las imágenes de la raíz, y la del sitio «Dofus Tools» (SITE=1: la home y su
  # cabecera). Van en un job porque arrancar otro contenedor cuesta más que los segundos
  # del Hielos o del sitio; cada paso corre solo si le toca
  embed:
    name: Embebido, Hielos y sitio
    needs: changes
    if: needs.changes.outputs.embed == 'true' || needs.changes.outputs.hielos == 'true' || needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: La imagen es la de la versión de Playwright
        run: test "$(node -p "require('@playwright/test/package.json').version")" = "1.64.0"
      - if: needs.changes.outputs.embed == 'true'
        run: npm run test:embed -- --retries=2
      - if: needs.changes.outputs.hielos == 'true'
        run: npm run test:hielos -- --retries=2
      - if: needs.changes.outputs.site == 'true'
        run: npm run test:site -- --retries=2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces-embed
          path: test-results
          retention-days: 7

  # El check que exige main: pasa si todo lo demás pasó o se saltó porque el PR no lo toca
  tests:
    name: Pruebas
    needs: [changes, unit, e2e, embed]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) exit 1 ;; esac
          done
