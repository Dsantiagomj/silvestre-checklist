name: Sync one Dofus guide

# La sincronización de un Dofus, la llama sync-guide.yml (una vez por Dofus): lee su página
# de datos de Torrente Arcano (el checklist clásico) y, si la guía cambió, regenera sus datos
# y abre un PR a main. Lo fusiona y despliega cuando pasan las pruebas de CI, que main exige.
# Si algo falla, abre un issue (o comenta en el que ya esté abierto).
on:
  workflow_call:
    inputs:
      # El Dofus que se sincroniza (los scripts de .build/ lo leen de DOFUS): sus datos van en
      # src/dofus/<dofus> y .build/lists/<dofus>
      dofus:
        required: true
        type: string
      # La página con los datos del checklist clásico
      guide_url:
        required: true
        type: string
      # La rama del PR de la sincronización
      sync_branch:
        required: true
        type: string
      # El título del commit y del PR, y el del issue si falla
      pr_title:
        required: true
        type: string
      issue_title:
        required: true
        type: string

env:
  GUIDE_URL: ${{ inputs.guide_url }}
  SYNC_BRANCH: ${{ inputs.sync_branch }}
  DOFUS: ${{ inputs.dofus }}
  PR_TITLE: ${{ inputs.pr_title }}

jobs:
  # Barato y en Linux: bajar la página, importarla y ver si cambia algo
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      reason: ${{ steps.fetch.outputs.reason || steps.import.outputs.reason }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Fetch the data page
        id: fetch
        run: |
          mkdir -p "$RUNNER_TEMP/ta"
          if ! curl -sSL --fail -A "Mozilla/5.0" -o "$RUNNER_TEMP/ta/page.html" "$GUIDE_URL"; then
            msg="la página de datos no responde ($GUIDE_URL)"
            echo "reason=$msg" >> "$GITHUB_OUTPUT"
            echo "::error::$msg"
            exit 1
          fi
      - name: Import the guide
        id: import
        run: |
          if ! python3 -I .build/import_guide.py "$RUNNER_TEMP/ta/page.html" 2> "$RUNNER_TEMP/ta/import.err"; then
            cat "$RUNNER_TEMP/ta/import.err"
            msg="no se pudo importar la página de datos ($GUIDE_URL): $(tail -n 1 "$RUNNER_TEMP/ta/import.err")"
            echo "reason=$msg" >> "$GITHUB_OUTPUT"
            echo "::error::$msg"
            exit 1
          fi
      - name: Anything new?
        id: diff
        run: |
          if [ -z "$(git status --porcelain "src/dofus/$DOFUS" ".build/lists/$DOFUS")" ]; then
            echo "Sin cambios en la guía."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git status --porcelain "src/dofus/$DOFUS" ".build/lists/$DOFUS"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v7
        if: steps.diff.outputs.changed == 'true'
        with:
          name: page-${{ inputs.dofus }}
          path: ${{ runner.temp }}/ta/page.html
          retention-days: 7

  # Los scripts de los assets recortan y comprimen las imágenes con ImageMagick
  # (.build/imaging.py; en un Mac usan sips)
  sync:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.pr.outputs.number }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Los datos crudos de DofusDB (~190 MB) y las cachés de la API: así regenerar no
      # vuelve a pedir lo que ya se bajó. Clave nueva en cada ejecución (y Dofus) para guardar
      # lo nuevo; se guarda aunque el job falle (Save the caches), así un reintento no lo baja
      # de nuevo. Los datos crudos son de todos los Dofus: se restaura la última de cualquiera
      - uses: actions/cache/restore@v6
        with:
          path: .build/data
          key: dofusdb-${{ inputs.dofus }}-${{ github.run_id }}
          restore-keys: dofusdb-
      - uses: actions/download-artifact@v8
        with:
          name: page-${{ inputs.dofus }}
          path: ${{ runner.temp }}/ta
      # La misma página que vio `check`; los scripts solo usan la biblioteca estándar.
      # La imagen de Ubuntu suele traer ImageMagick; si no, se instala
      - name: ImageMagick
        run: command -v magick >/dev/null || command -v convert >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick; }
      # DofusDB y Torrente fallan a veces (502, conexiones cortadas): cada script que va a la
      # red se reintenta hasta 3 veces. Repetirlos es seguro, guardan en caché lo que ya bajaron
      - name: Import and regenerate the assets
        run: |
          retry() {
            for i in 1 2 3; do
              "$@" && return 0
              echo "::warning::falló el intento $i de 3: $*"
              [ "$i" -lt 3 ] && sleep $((i * 30))
            done
            return 1
          }
          mkdir -p .build/data
          python3 -I .build/import_guide.py "$RUNNER_TEMP/ta/page.html"
          retry python3 -I .build/fetch_dofusdb.py
          retry python3 -I .build/match_assets.py
          retry python3 -I .build/build_assets_js.py
          retry python3 -I .build/build_quests_js.py
          retry python3 -I .build/build_weights.py
          retry python3 -I .build/build_figures.py
          retry python3 -I .build/fetch_start_maps.py
          retry python3 -I .build/build_resources.py
      # Para qué misión es cada objeto (item_quests.json): el audit lee los objetos que
      # acaba de escribir build_resources.py y este los vuelve a escribir ya con su misión.
      # Lo que ninguna misión pide (?) o falta (+) queda en el resumen del run
      - name: Audit the items against their quests
        run: |
          for i in 1 2 3; do
            python3 -I .build/audit_resources.py > "$RUNNER_TEMP/audit.txt" && break
            echo "::warning::falló el intento $i de 3 del audit"
            [ "$i" -eq 3 ] && exit 1
            sleep $((i * 30))
          done
          cat "$RUNNER_TEMP/audit.txt"
          {
            echo "### Objetos de los pasos frente a sus misiones"
            echo '```'
            cat "$RUNNER_TEMP/audit.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          python3 -I .build/build_resources.py
      - name: Save the caches
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .build/data
          key: dofusdb-${{ inputs.dofus }}-${{ github.run_id }}
      - name: Push the branch and open the PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A "src/dofus/$DOFUS" ".build/lists/$DOFUS" public/img
          if git diff --cached --quiet; then
            echo "Nada que subir."
            exit 0
          fi
          git switch -c "$SYNC_BRANCH"
          git commit -m "$PR_TITLE"
          git push --force origin "$SYNC_BRANCH"
          # Si quedó abierto el de una ejecución anterior, el push lo actualiza
          pr="$(gh pr list --head "$SYNC_BRANCH" --state open --json number --jq 'first | .number // empty')"
          if [ -z "$pr" ]; then
            gh pr create --base main --head "$SYNC_BRANCH" \
              --title "$PR_TITLE" \
              --body "Cambios de la página de datos ($GUIDE_URL), regenerados por $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            pr="$(gh pr list --head "$SYNC_BRANCH" --state open --json number --jq 'first | .number')"
          fi
          echo "number=$pr" >> "$GITHUB_OUTPUT"
      # Un PR abierto con GITHUB_TOKEN no lanza CI: se lanza a mano sobre la rama y se espera
      # al check "Pruebas" que exige la protección de main (el único job de la CI): se mira
      # su estado hasta que pasa o falla

  # Esperar la CI, fusionar y publicar: aparte de la regeneración, para que el issue diga
  # qué falló
  land:
    needs: sync
    if: needs.sync.outputs.pr
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Sin checkout: gh necesita saber el repo
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Wait for the tests
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.sync.outputs.pr }}
        run: |
          gh workflow run ci.yml --ref "$SYNC_BRANCH"
          # Hasta 40 minutos (el timeout de los jobs de CI con margen)
          for _ in $(seq 1 80); do
            state="$(gh pr checks "$PR" --json name,bucket --jq '.[] | select(.name == "Pruebas") | .bucket' || true)"
            case "$state" in
              pass) exit 0 ;;
              fail|cancel) echo "Pruebas: $state"; exit 1 ;;
            esac
            sleep 30
          done
          echo "Pruebas no terminó a tiempo"
          exit 1
      - name: Merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge "${{ needs.sync.outputs.pr }}" --squash --delete-branch
      # La fusión hecha con GITHUB_TOKEN tampoco lanza el despliegue: se pide aparte
      - name: Deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main

  report:
    needs: [check, sync, land]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REASON: ${{ needs.check.outputs.reason }}
          SYNC: ${{ needs.sync.result == 'failure' && 'failure' || needs.land.result }}
          TITLE: ${{ inputs.issue_title }}
        run: |
          title="$TITLE"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ -z "$REASON" ]; then
            if [ "$SYNC" = "failure" ]; then
              REASON="falló la regeneración, las pruebas del PR o la fusión (main no se tocó si fallaron las pruebas)"
            else
              REASON="falló la comprobación de la página de datos"
            fi
          fi
          body="$(printf 'Ejecución: %s\n\nMotivo: %s\n\nPágina de datos: %s' "$run_url" "$REASON" "$GUIDE_URL")"
          number="$(gh issue list --state open --search "in:title \"$title\"" --json number,title \
            --jq "map(select(.title == \"$title\")) | first | .number // empty")"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
